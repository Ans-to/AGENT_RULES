name: Render Blender tech promo
on:
  workflow_dispatch:
  push:
    branches: [arena/b7910db9-agent-rules]
    paths:
      - tech-promo/scene.py
      - .github/workflows/render-tech-promo.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {chunk: '01', start: 1, end: 90}
          - {chunk: '02', start: 91, end: 180}
          - {chunk: '03', start: 181, end: 270}
          - {chunk: '04', start: 271, end: 360}
          - {chunk: '05', start: 361, end: 450}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender xvfb xauth libgl1-mesa-dri
      - name: Render frames in Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p frames
          xvfb-run -a blender -b --threads 2 --python tech-promo/scene.py -- --start ${{ matrix.start }} --end ${{ matrix.end }} --output "$PWD/frames/"
          test "$(find frames -name '*.png' | wc -l)" -eq 90
      - uses: actions/upload-artifact@v4
        with:
          name: tech-promo-frames-${{ matrix.chunk }}
          path: frames/*.png
          retention-days: 3
          if-no-files-found: error
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tech-promo-frames-*
          path: frames
          merge-multiple: true
      - name: Assemble and verify silent MP4
        run: |
          test "$(find frames -name '*.png' | wc -l)" -eq 450
          mkdir -p output
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -start_number 1 -i 'frames/%04d.png' -frames:v 450 -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -movflags +faststart output/tech-promo-15s.mp4
          ffmpeg -v error -i output/tech-promo-15s.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames,r_frame_rate -show_entries format=duration -of json output/tech-promo-15s.mp4 | tee output/metadata.json
          for frame in 30 110 215 315 410; do ffmpeg -loglevel error -y -i output/tech-promo-15s.mp4 -vf "select=eq(n\,$frame)" -vsync 0 -frames:v 1 "output/frame-$frame.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: blender-tech-promo-15s
          path: output/
          retention-days: 30
          if-no-files-found: error
