name: Render Blender Cycles promo
on:
  workflow_dispatch:
  push:
    branches: [arena/b7910db9-agent-rules]
    paths:
      - cycles-premium/scene.py
      - .github/workflows/render-cycles-premium.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {chunk: '01', start: 1, end: 20}
          - {chunk: '02', start: 21, end: 40}
          - {chunk: '03', start: 41, end: 60}
          - {chunk: '04', start: 61, end: 80}
          - {chunk: '05', start: 81, end: 100}
          - {chunk: '06', start: 101, end: 120}
          - {chunk: '07', start: 121, end: 140}
          - {chunk: '08', start: 141, end: 160}
          - {chunk: '09', start: 161, end: 180}
          - {chunk: '10', start: 181, end: 200}
          - {chunk: '11', start: 201, end: 220}
          - {chunk: '12', start: 221, end: 240}
          - {chunk: '13', start: 241, end: 260}
          - {chunk: '14', start: 261, end: 280}
          - {chunk: '15', start: 281, end: 300}
          - {chunk: '16', start: 301, end: 320}
          - {chunk: '17', start: 321, end: 340}
          - {chunk: '18', start: 341, end: 360}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender xvfb xauth libgl1-mesa-dri
      - name: Render frames in Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p frames
          xvfb-run -a blender -b --threads 2 --python cycles-premium/scene.py -- --start ${{ matrix.start }} --end ${{ matrix.end }} --output "$PWD/frames/"
          test "$(find frames -name '*.png' | wc -l)" -eq 20
      - uses: actions/upload-artifact@v4
        with:
          name: cycles-premium-frames-${{ matrix.chunk }}
          path: frames/*.png
          retention-days: 3
          if-no-files-found: error
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/b7910db9-agent-rules
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: cycles-premium-frames-*
          path: frames
          merge-multiple: true
      - name: Assemble and verify silent MP4
        run: |
          test "$(find frames -name '*.png' | wc -l)" -eq 360
          mkdir -p output
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 1 -i 'frames/%04d.png' -frames:v 360 -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -movflags +faststart output/cycles-premium-15s.mp4
          ffmpeg -v error -i output/cycles-premium-15s.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames,r_frame_rate -show_entries format=duration -of json output/cycles-premium-15s.mp4 | tee output/metadata.json
          for frame in 24 96 180 270 340; do ffmpeg -loglevel error -y -i output/cycles-premium-15s.mp4 -vf "select=eq(n\,$frame)" -vsync 0 -frames:v 1 "output/frame-$frame.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: blender-cycles-premium-15s
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Publish completed video to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/b7910db9-agent-rules
          mkdir -p cycles-premium/render
          cp output/cycles-premium-15s.mp4 cycles-premium/render/cycles-premium-15s.mp4
          git add cycles-premium/render/cycles-premium-15s.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Add rendered Cycles premium video'
            git push origin arena/b7910db9-agent-rules
          fi
